<title>축산 디지털 운영체제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Gowun+Batang:wght@400;700&display=swap">

<style>
:root{
  --ground:#F2F5F6; --surface:#FFFFFF; --surface-2:#F6F9F9; --surface-3:#EAF1F1;
  --ink:#0B2239; --ink-2:#243B53; --muted:#5A6B76; --faint:#8B9BA5;
  --line:#D6E0E4; --line-strong:#B6C6CD;
  --teal:#0E7C7B; --teal-deep:#095352; --mint:#16B0A6;
  --amber:#B06A16; --amber-soft:#F5EBDC;
  --risk:#A8322F; --risk-soft:#F7E7E6;
  --ok:#0E7C7B;
  --rail:#0B2239; --rail-ink:#DCE7EB; --rail-muted:#7C93A0; --rail-line:#1D3444;
  --shadow:0 1px 2px rgba(11,34,57,.06), 0 8px 28px -12px rgba(11,34,57,.18);
  --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --serif:"Gowun Batang",Batang,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#060F14; --surface:#0D1B23; --surface-2:#112530; --surface-3:#16303C;
    --ink:#E6EFF2; --ink-2:#C4D6DD; --muted:#95A9B3; --faint:#6C838F;
    --line:#1E3743; --line-strong:#2C4B59;
    --teal:#2FBFB4; --teal-deep:#7BD8CF; --mint:#4FD8CC;
    --amber:#E0A052; --amber-soft:#2A2013;
    --risk:#EC7A75; --risk-soft:#2E1614;
    --ok:#2FBFB4;
    --rail:#040C10; --rail-ink:#D2E2E7; --rail-muted:#6F8794; --rail-line:#17303C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#060F14; --surface:#0D1B23; --surface-2:#112530; --surface-3:#16303C;
  --ink:#E6EFF2; --ink-2:#C4D6DD; --muted:#95A9B3; --faint:#6C838F;
  --line:#1E3743; --line-strong:#2C4B59;
  --teal:#2FBFB4; --teal-deep:#7BD8CF; --mint:#4FD8CC;
  --amber:#E0A052; --amber-soft:#2A2013;
  --risk:#EC7A75; --risk-soft:#2E1614;
  --ok:#2FBFB4;
  --rail:#040C10; --rail-ink:#D2E2E7; --rail-muted:#6F8794; --rail-line:#17303C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-weight:400; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul{padding-left:0; list-style:none}
a{color:var(--teal)}

/* ── shell ─────────────────────────────────────────── */
.shell{display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh}
.rail{
  background:var(--rail); color:var(--rail-ink);
  padding:26px 20px 40px; position:sticky; top:0; height:100vh;
  overflow-y:auto; border-right:1px solid var(--rail-line);
}
.rail-mark{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--mint)}
.rail-title{font-size:19px; font-weight:600; margin-top:8px; letter-spacing:-.01em; line-height:1.25}
.rail-sub{font-size:11.5px; color:var(--rail-muted); margin-top:7px; line-height:1.5}
.rail-hr{height:1px; background:var(--rail-line); margin:22px 0 16px; border:0}
.rail-label{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--rail-muted); margin-bottom:10px}
.tracks{display:flex; flex-direction:column; gap:3px}
.track-btn{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  background:none; border:0; border-radius:5px; padding:8px 9px;
  color:var(--rail-ink); font-family:var(--sans); font-size:12.5px; cursor:pointer;
  transition:background .14s ease;
}
.track-btn:hover{background:rgba(255,255,255,.06)}
.track-btn[aria-pressed="true"]{background:rgba(47,191,180,.16); color:#fff}
.track-btn:focus-visible{outline:2px solid var(--mint); outline-offset:1px}
.dot{width:7px; height:7px; border-radius:50%; flex:none; background:currentColor; opacity:.55}
.track-btn[aria-pressed="true"] .dot{opacity:1; background:var(--mint)}
.tcount{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--rail-muted)}
.rail-note{font-size:11px; color:var(--rail-muted); line-height:1.6; margin-top:6px}
.rail-note b{color:var(--rail-ink); font-weight:500}

.stage{padding:34px clamp(16px,3.4vw,52px) 88px; min-width:0}
.stage-head{max-width:1180px; margin:0 auto 26px; display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; justify-content:space-between}
.stage-head h1{font-size:15px; font-weight:600; letter-spacing:-.01em}
.stage-head p{font-size:12.5px; color:var(--muted); margin-top:3px}
.toolbar{display:flex; gap:7px}
.tool{
  font-family:var(--mono); font-size:11px; letter-spacing:.04em;
  background:var(--surface); color:var(--muted); border:1px solid var(--line);
  border-radius:5px; padding:6px 11px; cursor:pointer;
}
.tool:hover{color:var(--ink); border-color:var(--line-strong)}
.tool:focus-visible{outline:2px solid var(--teal); outline-offset:1px}

.deck{max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:30px}
.slide-wrap{display:flex; flex-direction:column; gap:0}
.slide-wrap[hidden]{display:none}

/* ── slide card ───────────────────────────────────── */
.slide{
  container-type:inline-size;
  position:relative; aspect-ratio:16/9; background:var(--surface);
  border:1px solid var(--line); border-radius:3px; box-shadow:var(--shadow);
  padding:4.6cqw 5cqw 4.2cqw; display:flex; flex-direction:column; overflow:hidden;
}
.slide::before{content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--teal)}
.slide.is-cover::before{background:var(--amber)}
.s-top{display:flex; align-items:baseline; gap:1.4cqw; margin-bottom:2.1cqw}
.eyebrow{
  font-family:var(--mono); font-size:1.05cqw; letter-spacing:.16em; text-transform:uppercase;
  color:var(--teal); font-weight:500;
}
.stage-chip{
  margin-left:auto; font-family:var(--mono); font-size:.95cqw; letter-spacing:.1em;
  color:var(--faint); border:1px solid var(--line); border-radius:99px; padding:.3cqw 1cqw;
}
.s-title{font-size:2.55cqw; font-weight:600; line-height:1.28; letter-spacing:-.018em; text-wrap:balance; max-width:88%}
.s-title em{font-style:normal; color:var(--teal)}
.s-lede{font-size:1.34cqw; color:var(--muted); margin-top:1.1cqw; line-height:1.6; max-width:78%}
.s-body{margin-top:2.6cqw; flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:1.6cqw}
.s-foot{
  margin-top:auto; padding-top:1.6cqw; border-top:1px solid var(--line);
  font-size:1.12cqw; color:var(--ink-2); display:flex; gap:1cqw; align-items:baseline;
}
.s-foot .k{font-family:var(--mono); font-size:.95cqw; letter-spacing:.12em; text-transform:uppercase; color:var(--teal); flex:none}
.pageno{position:absolute; right:2.2cqw; bottom:1.6cqw; font-family:var(--mono); font-size:1cqw; color:var(--faint)}

/* content primitives (cqw-scaled) */
.cols{display:grid; gap:1.5cqw; flex:1; min-height:0}
.cols.c2{grid-template-columns:1fr 1fr}
.cols.c3{grid-template-columns:repeat(3,1fr)}
.cols.c4{grid-template-columns:repeat(4,1fr)}
.cols.c25{grid-template-columns:1.25fr 1fr}
.cols.c52{grid-template-columns:1fr 1.6fr}
/* a grid holding a table must not stretch its rows — table rows would fan apart */
.cols:has(> table.t){align-content:center}
.cols:has(> div > table.t){align-content:center}
.s-body > table.t{align-self:start}
.cols > table.t{align-self:start}
.card{
  background:var(--surface-2); border:1px solid var(--line); border-radius:3px;
  padding:1.7cqw 1.8cqw; display:flex; flex-direction:column; gap:.7cqw; min-height:0;
}
.card.accent{background:var(--surface-3); border-color:var(--line-strong)}
.card.warn{background:var(--amber-soft); border-color:var(--amber)}
.card.risk{background:var(--risk-soft); border-color:var(--risk)}
.card .kicker{font-family:var(--mono); font-size:.95cqw; letter-spacing:.14em; text-transform:uppercase; color:var(--teal)}
.card.warn .kicker{color:var(--amber)}
.card.risk .kicker{color:var(--risk)}
.card h4{font-size:1.42cqw; font-weight:600; line-height:1.35; letter-spacing:-.01em}
.card p{font-size:1.12cqw; color:var(--muted); line-height:1.62}
.card p strong{color:var(--ink); font-weight:600}

.bul{display:flex; flex-direction:column; gap:.85cqw}
.bul li{font-size:1.18cqw; line-height:1.6; color:var(--ink-2); padding-left:1.5cqw; position:relative}
.bul li::before{content:""; position:absolute; left:0; top:.72cqw; width:.5cqw; height:.5cqw; border-radius:50%; background:var(--teal)}
.bul li strong{color:var(--ink); font-weight:600}
.bul.dense li{font-size:1.06cqw}

.metrics{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:1.5cqw}
.metric{border-top:2px solid var(--teal); padding-top:1.1cqw; display:flex; flex-direction:column; gap:.35cqw}
.metric.amber{border-color:var(--amber)}
.metric .fig{font-family:var(--mono); font-size:2.9cqw; font-weight:600; letter-spacing:-.02em; line-height:1; font-variant-numeric:tabular-nums}
.metric.amber .fig{color:var(--amber)}
.metric .lab{font-size:1.05cqw; color:var(--muted); line-height:1.45}
.metric.wide .fig{font-size:1.95cqw}

table.t{width:100%; border-collapse:collapse; font-size:1.08cqw}
table.t th{
  text-align:left; font-family:var(--mono); font-size:.92cqw; letter-spacing:.11em;
  text-transform:uppercase; color:var(--teal); font-weight:500;
  padding:0 .9cqw .7cqw 0; border-bottom:1px solid var(--line-strong);
}
table.t td{padding:.72cqw .9cqw .72cqw 0; border-bottom:1px solid var(--line); color:var(--ink-2); vertical-align:top; line-height:1.5}
table.t td strong{color:var(--ink); font-weight:600}
table.t .num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; padding-right:0}
table.t tr:last-child td{border-bottom:0}
table.t tr.sum td{border-top:1px solid var(--line-strong); border-bottom:0; font-weight:600; color:var(--ink)}

.yes{color:var(--ok); font-weight:600}
.no{color:var(--risk); font-weight:600}
.part{color:var(--amber); font-weight:600}

.stack-layers{display:flex; flex-direction:column; gap:.55cqw; flex:1}
.layer{
  display:grid; grid-template-columns:7.5cqw 1fr; gap:1.4cqw; align-items:center;
  border:1px solid var(--line); border-left:3px solid var(--teal);
  background:var(--surface-2); border-radius:2px; padding:1.05cqw 1.4cqw; flex:1;
}
.layer .lno{font-family:var(--mono); font-size:.95cqw; letter-spacing:.1em; color:var(--teal); text-transform:uppercase}
.layer .lname{font-size:1.3cqw; font-weight:600; letter-spacing:-.01em}
.layer .ldesc{font-size:1.04cqw; color:var(--muted); line-height:1.5; margin-top:.18cqw}
.layer .lowner{margin-left:auto; font-family:var(--mono); font-size:.95cqw; color:var(--faint); white-space:nowrap}
.layer .lmain{display:flex; align-items:baseline; gap:1cqw; flex-wrap:wrap}
.layer.l4{border-left-color:var(--amber)} .layer.l4 .lno{color:var(--amber)}
.layer.l3{border-left-color:var(--teal)}
.layer.l2{border-left-color:var(--mint)} .layer.l2 .lno{color:var(--mint)}
.layer.l1{border-left-color:var(--ink-2)} .layer.l1 .lno{color:var(--ink-2)}

.flow{display:flex; align-items:stretch; gap:.8cqw; flex-wrap:nowrap}
.step{
  flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:2px;
  padding:1.2cqw 1.1cqw; display:flex; flex-direction:column; gap:.45cqw; min-width:0;
}
.step .sn{font-family:var(--mono); font-size:.92cqw; color:var(--teal); letter-spacing:.1em}
.step .st{font-size:1.16cqw; font-weight:600; line-height:1.32}
.step .sd{font-size:1cqw; color:var(--muted); line-height:1.5}
.arrow{align-self:center; color:var(--faint); font-size:1.5cqw; flex:none}

.quote{
  font-family:var(--serif); font-size:2.05cqw; line-height:1.5; color:var(--ink);
  border-left:3px solid var(--amber); padding-left:2cqw; max-width:86%; letter-spacing:-.01em;
}
.quote small{display:block; font-family:var(--sans); font-size:1.1cqw; color:var(--muted); margin-top:1.2cqw; letter-spacing:0}

.boundary{border:1px dashed var(--line-strong); border-radius:3px; padding:1.4cqw 1.6cqw; display:flex; flex-direction:column; justify-content:center; gap:.9cqw}
.boundary .bt{font-family:var(--mono); font-size:.95cqw; letter-spacing:.13em; text-transform:uppercase; color:var(--faint)}

/* cover */
.slide.is-cover{justify-content:center; gap:0}
.cover-mark{font-family:var(--mono); font-size:1.1cqw; letter-spacing:.3em; text-transform:uppercase; color:var(--amber)}
.cover-h{font-size:4.4cqw; font-weight:600; letter-spacing:-.03em; line-height:1.12; margin-top:1.6cqw}
.cover-h span{font-family:var(--serif); font-weight:400; color:var(--teal)}
.cover-sub{font-size:1.5cqw; color:var(--muted); margin-top:1.6cqw; max-width:64%; line-height:1.6}
.cover-meta{margin-top:3.2cqw; display:flex; gap:2.6cqw; font-family:var(--mono); font-size:1.02cqw; color:var(--faint); letter-spacing:.04em; flex-wrap:wrap}
.cover-meta b{color:var(--ink-2); font-weight:500}

/* notes */
.notes{
  border:1px solid var(--line); border-top:0; background:var(--surface-2);
  border-radius:0 0 3px 3px; font-size:13px;
}
.notes summary{
  cursor:pointer; padding:9px 16px; font-family:var(--mono); font-size:11px;
  letter-spacing:.13em; text-transform:uppercase; color:var(--muted); list-style:none;
}
.notes summary::-webkit-details-marker{display:none}
.notes summary::before{content:"▸ "; color:var(--teal)}
.notes[open] summary::before{content:"▾ "}
.notes summary:focus-visible{outline:2px solid var(--teal); outline-offset:-2px}
.notes .nbody{padding:2px 20px 18px; color:var(--ink-2); line-height:1.72; max-width:74ch}
.notes .nbody p{margin-bottom:9px}
.notes .nbody p:last-child{margin-bottom:0}
.notes .nbody b{color:var(--ink); font-weight:600}
.notes .nbody .say{
  border-left:2px solid var(--amber); padding-left:12px; font-family:var(--serif);
  font-size:15px; color:var(--ink);
}
.notes .nbody .warnline{color:var(--risk); font-weight:500}

.tag-row{display:flex; gap:5px; padding:7px 16px 0; flex-wrap:wrap}
.tag{font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); border:1px solid var(--line); border-radius:99px; padding:2px 8px}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static; height:auto; padding:20px}
  .tracks{flex-direction:row; flex-wrap:wrap}
  .track-btn{width:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}

/* ── print / PDF ──────────────────────────────────── */
@page{size:1280px 720px; margin:0}
@media print{
  body{background:#fff}
  .rail,.stage-head,.notes,.tag-row{display:none !important}
  .stage{padding:0}
  .deck{max-width:none; gap:0}
  .slide-wrap[hidden]{display:none !important}
  .slide{
    width:1280px; height:720px; aspect-ratio:auto; border:0; border-radius:0;
    box-shadow:none; break-after:page; page-break-after:always;
  }
  .slide::before{background:var(--teal) !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
}
</style>

<div class="shell">
  <nav class="rail" aria-label="트랙 선택">
    <div class="rail-mark">CowTalk v5</div>
    <div class="rail-title">축산 디지털<br>운영체제</div>
    <div class="rail-sub">지자체 · 국가 · 전문가 · 해외정부<br>소개 · 교육 · 사업제안 통합덱</div>
    <hr class="rail-hr">
    <div class="rail-label">청중 트랙</div>
    <div class="tracks" id="tracks"></div>
    <hr class="rail-hr">
    <div class="rail-label">발표 전 확인</div>
    <p class="rail-note">
      <b>①</b> 당일 수치는 <code>/api/public/stats</code>로 확인<br>
      <b>②</b> 서버 pre-warm 15분 전<br>
      <b>③</b> 시연 실패 대비 녹화본 준비
    </p>
  </nav>

  <main class="stage">
    <div class="stage-head">
      <div>
        <h1 id="trackName">전체 덱</h1>
        <p id="trackDesc">모든 트랙의 슬라이드를 순서대로 표시합니다.</p>
      </div>
      <div class="toolbar">
        <button class="tool" id="notesBtn" type="button">노트 모두 펼치기</button>
        <button class="tool" id="printBtn" type="button">인쇄 · PDF</button>
      </div>
    </div>
    <div class="deck" id="deck"></div>
  </main>
</div>

<script>
const TRACKS = [
  {id:'all',   name:'전체 덱',            desc:'모든 트랙의 슬라이드를 순서대로 표시합니다.'},
  {id:'core',  name:'공통 · 코어',        desc:'어떤 청중에게도 먼저 말해야 하는 기본 9장.'},
  {id:'local', name:'지역정부 (지자체)',  desc:'예산과 성과. 결재 문장 = "우리 도가 먼저 했다".'},
  {id:'natl',  name:'국가 · 방역기관',    desc:'전국 표준과 데이터 주권. 결재 문장 = "이게 표준이 될 수 있다".'},
  {id:'vet',   name:'전문가 · 거점병원',  desc:'수의사·수정사. 결재 문장 = "대체가 아니라 증폭이다".'},
  {id:'biz',   name:'파트너 · 비즈니스',  desc:'4주체 구조와 수익 모델. 투자·파트너 협상용.'},
  {id:'intl',  name:'Overseas (EN)',      desc:'해외 정부 관계자. 결재 문장 = "주권을 지키며 도입 가능하다".'},
];

const S = [];
const add = (o) => S.push(o);

/* ══ COVER ══ */
add({t:['core'], cover:true, body:`
  <div class="cover-mark">Livestock Digital Operating System</div>
  <h2 class="cover-h">소가 말하지 못하는 것을<br><span>국가가 듣는다</span></h2>
  <p class="cover-sub">위내센서 · 공공데이터 · AI 해석 · 역할별 액션플랜을 하나로 묶은
  축산 디지털 운영체제. 한 마리의 소에서 시작해 전국 방역까지 하나의 데이터 척추로 잇습니다.</p>
  <div class="cover-meta">
    <span>CowTalk <b>v5.0</b></span>
    <span>운영 규모 <b>약 200 농장 · 1.1만 두</b></span>
    <span>파일럿 <b>경기도 · 송영신목장</b></span>
    <span><b>D2O Corp</b></span>
  </div>`,
  n:`<p><b>첫 30초가 전부다.</b> 회사 소개로 시작하지 않는다. 문제로 시작한다.</p>

  n:`<p><b>여기서 실제 시연을 한다.</b> 슬라이드보다 화면이 강하다.</p>

add({t:['local','natl'], eyebrow:'방역', stage:'그래서 · 결과 ①',

  lede:'그림이 아니라 SEIR 미분방정식 계산 결과다. 이동제한을 걸었을 때와 안 걸었을 때의 차이를 정량으로 비교한다.',
  body:`<div class="cols c4">
    <div class="card"><div class="kicker">01 탐지</div><h4>집단 발열 감지</h4><p>농장 단위 이상 징후를 클러스터로 자동 포착</p></div>

  </div>`,
  foot:['옵션 가치','전염병을 <strong>한 번만 막으면</strong> 시스템 비용은 그 자체로 회수된다. 이건 투자가 아니라 보험이다.'],
  n:`<p>03(SEIR) 카드에서 멈춘다. 여기가 이 장의 무게중심이다.</p>

add({t:['local','natl'], eyebrow:'사회 · 환경', stage:'그래서 · 결과 ③',

  n:`<p><b>지자체 발표에서 가장 크게 먹히는 장이다.</b> 축산과 예산이 환경 성과로 연결되기 때문이다.</p>

add({t:['local'], eyebrow:'요청', stage:'그래서',
  title:'저희 숫자가 아니라 <em>여러분 지역의 숫자</em>를 만드는 것',
  lede:'파일럿의 목적은 시연이 아니라 그 지역의 실측 근거를 확보하는 것이다.',
  body:`<div class="cols c3">
    <div class="card"><div class="kicker">요청 1</div><h4>시범사업</h4>
      <p>일부 시군 + 공수의사 대상 실증. 규모보다 <strong>지표 사전 합의</strong>가 중요하다.</p></div>

    <div class="card"><div class="kicker">요청 3</div><h4>확산 로드맵 공동 수립</h4>

    공태일 · 수태율 · 두당 일 마진 · 방역 대응 시간</p></div>`,
  n:`<p>마무리는 <b>요청 세 개로 짧게</b>. 여기서 새 정보를 넣지 않는다.</p>
     <p><b>성과지표를 우리가 먼저 제안하는 것</b>이 핵심이다. 평가받을 기준을 스스로 내미는 벤더는 드물고, 그게 신뢰가 된다.</p>
     <p class="say">"평가 기준을 저희가 먼저 제안드리겠습니다. 이 지표가 안 움직이면 확산하지 마십시오."</p>`});

add({t:['natl'], eyebrow:'국가', stage:'무엇을',
  title:'국가 방역의 데이터는 <em>신고된 것</em>에서 시작한다',

  body:`<div class="flow">

  foot:['포지셔닝','CowTalk은 KAHIS를 <strong>대체하지 않는다.</strong> 앞의 두 칸을 채워서 넘긴다 — 조기감시 레이어(Early Warning Layer)다.'],

     저희가 보는 건 <b>신고가 들어오기 전 며칠</b>입니다. 그 구간이 지금 비어 있습니다. 채워서 넘겨드리겠습니다."</p>

add({t:['natl','intl'], eyebrow:'데이터 주권', stage:'어떻게',
  title:'보안을 말로 하지 않고 <em>구조로</em> 증명한다',
  lede:'심의에서 가장 먼저 나오는 질문이자, 해외 계약의 전제 조건이다. 네 가지 모두 구현되어 있다.',
  body:`<div class="cols c2">
    <div class="bul">
      <li><strong>Data Spine 원칙</strong> — 모든 데이터는 DB를 거친다. AI가 파이프라인을 우회해 직접 판단하지 않는다.</li>

      <li><strong>기억의 권한 경계</strong> — AI 장기기억조차 그 계정 권한 안의 것만 회상한다. 권한 밖 맥락은 저장도 하지 않는다.</li>
    </div>
    <div class="boundary">
      <div class="bt">Export Boundary · 반출 경계</div>
      <div class="card" style="background:var(--surface);border-color:var(--line)"><div class="kicker" style="color:var(--risk)">나가지 않는 것</div>
        <p>원시 센서 데이터 · 개체 식별정보 · 농가 식별정보 · 진료 및 처방 기록</p></div>
      <div class="card" style="background:var(--surface);border-color:var(--line)"><div class="kicker">승인 시 나가는 것</div>
        <p>익명화 · 집계된 통계만. 옵트인 + 익명화 + 집계 <strong>세 조건을 모두</strong> 만족할 때.</p></div>
    </div>
  </div>`,
  n:`<p><b>이 장은 먼저 꺼낸다.</b> 질문받고 답하면 방어로 보이고, 먼저 말하면 설계로 보인다.</p>
     <p>"민간 회사 서버에 국가 방역 데이터가 쌓이는 겁니까?"에 대한 답은 다음 장(4주체 구조)에 있다.
     → "그래서 <b>데이터센터를 별도 주체로 분리</b>했습니다"로 이어간다.</p>`});

add({t:['natl','vet'], eyebrow:'정책 연계', stage:'그래서',
  title:'거점 대동물병원은 진료소이자 <em>방역 초소</em>가 된다',
  lede:'임상 데이터와 방역 데이터가 처음으로 같은 화면에서 만난다. 지금까지 없던 구조다.',
  body:`<div class="cols c52">
    <div class="card accent"><div class="kicker">정책의 빈칸</div><h4>건물과 인력만으로는<br>총 진료 역량이 안 는다</h4>
      <p>한 명이 볼 수 있는 농가 수가 그대로면 거점을 만들어도 커버리지는 그대로다.
      <strong>거점이 성공하려면 원격 트리아지가 전제</strong>이고, 원격 트리아지는 소의 몸속 데이터가 있어야 가능하다.</p></div>
    <div class="flow" style="flex-direction:column;gap:.6cqw">
      <div class="step"><div class="sn">농가</div><div class="st">센서 이상징후</div><div class="sd">DSI 경보 → 거점병원 케이스 큐로 자동 유입</div></div>
      <div class="step"><div class="sn">병원</div><div class="st">임상 판단 · 처치</div><div class="sd">감별진단 · 처방 · 휴약 관리 · 결과 추적</div></div>
      <div class="step"><div class="sn">지역</div><div class="st">방역 상황판</div><div class="sd">집단 이상 시 접촉망 · 확산 시뮬 · 역학조사</div></div>
      <div class="step"><div class="sn">국가</div><div class="st">KAHIS 보고</div><div class="sd">조사 결과가 국가 보고 체계로 연결</div></div>
    </div>
  </div>`,
  n:`<p><b>거점병원 정책이 추진 중이라면 이 장이 발표의 승부처다.</b></p>

add({t:['vet'], eyebrow:'책임 경계', stage:'어떻게',

add({t:['intl'], eyebrow:'Overseas', stage:'What',
  title:'Three walls every livestock nation is hitting',
  lede:'The workforce is shrinking, disease is always found late, and the data exists but never reaches the decision.',
  body:`<div class="cols c3">
    <div class="card"><div class="kicker">Wall 1 · People</div><h4>The workforce is disappearing</h4>
      <p>Large-animal veterinarians are aging out and few replace them. Two hours of driving for one farm visit. <strong>When people leave faster than technology arrives, livestock becomes unmanageable.</strong></p></div>
    <div class="card"><div class="kicker">Wall 2 · Disease</div><h4>Always found too late</h4>
      <p>Cattle do not report illness. By the time it is visible, it is late. <strong>At the moment of first notification, spread has already begun.</strong></p></div>
    <div class="card"><div class="kicker">Wall 3 · Data</div><h4>Present but disconnected</h4>
      <p>Traceability, grading, milk recording, disease reporting — all exist. <strong>No single farmer can connect them to one animal.</strong></p></div>
  </div>`,
  n:`<p>Open with the problem, never with the company. Officials have seen a hundred vendor decks.</p>
     <p class="say">"We are not here to sell you a farm app. We are here to show you how a country can see an outbreak <b>before it is reported.</b>"</p>
     <p>For <b>Southeast Asia</b>, weight Wall 2 (disease containment). For <b>the Gulf</b>, weight Wall 3 and reframe it as food security visibility.</p>`});

add({t:['intl'], eyebrow:'Sovereignty', stage:'How',
  title:'Code flows out. <em>Data never does.</em>',
  lede:'A sovereign instance runs inside your national infrastructure. We export an operating system, not your data.',
  body:`<div class="cols c52">
    <div class="card accent"><div class="kicker">Deployment</div><h4>One codebase,<br>national instances</h4>

        <p>Raw sensor data · animal identifiers · farm identifiers · clinical and prescription records</p></div>
      <div class="card" style="background:var(--surface);border-color:var(--line)"><div class="kicker">Crosses only with your approval</div>
        <p>Anonymized, aggregated statistics — and only when opt-in, anonymization and aggregation all hold.</p></div>
    </div>
  </div>`,
  foot:['Say it first','Raise sovereignty <strong>before they ask.</strong> Answered on request it reads as defense; offered first it reads as design.'],
  n:`<p>This is <b>the single most important slide for any overseas government audience.</b> Spend time here.</p>
     <p class="say">"Your data stays inside your borders. What crosses the boundary is anonymized aggregate statistics, and only with your approval."</p>

add({t:['intl'], eyebrow:'Markets', stage:'So what',
  title:'Two priority regions, <em>two different entry models</em>',
  lede:'Southeast Asia enters through disease control and public financing. The Gulf enters through food security and direct national contracts.',
  body:`<div class="cols c2">
    <div class="card"><div class="kicker">Southeast Asia · VN · ID · TH</div><h4>Lead with disease containment</h4>
      <p>FMD and LSD are endemic; governments prioritize outbreak control over productivity.
      Smallholder structure means <strong>per-head pricing must be redesigned</strong> — cooperative and enterprise bundles, not per-animal fees.</p>
      <p><strong>Entry:</strong> KSP policy advisory → ODA-funded pilot → national budget scale-up.</p></div>
    <div class="card"><div class="kicker">Middle East · Central Asia · UAE · SA · UZ</div><h4>Lead with food security</h4>
      <p>Dairy self-sufficiency is a national security agenda, not an agricultural one. Budget constraints are lower and
      <strong>contracts are national in scale</strong>. Extreme heat stress and very large single farms drive the technical work.</p>
      <p><strong>Entry:</strong> direct national license with sovereign instance build.</p></div>
  </div>
  <table class="t">
    <thead><tr><th>Model</th><th>Structure</th><th>Best fit</th></tr></thead>
    <tbody>
      <tr><td><strong>A · National license</strong></td><td>Annual fixed fee + sovereign instance build</td><td>Gulf states</td></tr>
      <tr><td><strong>B · Per-head royalty</strong></td><td>Local partner operates, royalty per head</td><td>Southeast Asia, scale-up phase</td></tr>
      <tr><td><strong>C · ODA / KSP linked</strong></td><td>Public funds build it, then transition to operations</td><td>Southeast Asia, entry phase</td></tr>
      <tr><td><strong>D · White label</strong></td><td>Local brand, D2O core underneath</td><td>Where a large local incumbent exists</td></tr>
    </tbody>

  n:`<p><b>Never quote Korean pricing abroad.</b> It is too expensive for Southeast Asia and too cheap for the Gulf — both lose the deal.</p>

     <p>Financing is the real gate in Southeast Asia. <b>Design the funding route before the product pitch.</b></p>`});

const tracksEl = document.getElementById('tracks');
const TNAME = Object.fromEntries(TRACKS.map(t=>[t.id,t.name]));

S.forEach((s,i)=>{
  const wrap = document.createElement('article');
  wrap.className = 'slide-wrap';
  wrap.dataset.tracks = s.t.join(' ');
  const no = String(i+1).padStart(2,'0');

  const head = s.cover ? '' : `
    <div class="s-top">
      <span class="eyebrow">${s.eyebrow||''}</span>
      ${s.stage?`<span class="stage-chip">${s.stage}</span>`:''}
    </div>
    <h2 class="s-title">${s.title||''}</h2>
    ${s.lede?`<p class="s-lede">${s.lede}</p>`:''}`;

  const foot = s.foot ? `<div class="s-foot"><span class="k">${s.foot[0]}</span><span>${s.foot[1]}</span></div>` : '';

  wrap.innerHTML = `
    <section class="slide${s.cover?' is-cover':''}">
      ${head}
      ${s.cover ? s.body : `<div class="s-body">${s.body||''}</div>`}
      ${foot}
      <span class="pageno">${no}</span>
    </section>
    <div class="tag-row">${s.t.map(t=>`<span class="tag">${TNAME[t]||t}</span>`).join('')}</div>
    ${s.n?`<details class="notes"><summary>발표자 노트 ${no}</summary><div class="nbody">${s.n}</div></details>`:''}`;
  deck.appendChild(wrap);
});

let active = 'all';
TRACKS.forEach(t=>{
  const count = t.id==='all' ? S.length : S.filter(s=>s.t.includes(t.id)).length;
  const b = document.createElement('button');
  b.className='track-btn'; b.type='button'; b.dataset.track=t.id;
  b.setAttribute('aria-pressed', String(t.id===active));
  b.innerHTML = `<span class="dot"></span><span>${t.name}</span><span class="tcount">${count}</span>`;
  b.addEventListener('click', ()=>setTrack(t.id));
  tracksEl.appendChild(b);
});

function setTrack(id){
  active = id;
  const t = TRACKS.find(x=>x.id===id);
  document.getElementById('trackName').textContent = t.name;
  document.getElementById('trackDesc').textContent = t.desc;
  tracksEl.querySelectorAll('.track-btn').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.track===id)));
  deck.querySelectorAll('.slide-wrap').forEach(w=>{
    w.hidden = !(id==='all' || w.dataset.tracks.split(' ').includes(id));
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

const nb = document.getElementById('notesBtn');
nb.addEventListener('click', ()=>{
  const anyClosed = [...deck.querySelectorAll('.notes')].some(d=>!d.open);
  deck.querySelectorAll('.notes').forEach(d=>{ d.open = anyClosed; });
  nb.textContent = anyClosed ? '노트 모두 접기' : '노트 모두 펼치기';
});
document.getElementById('printBtn').addEventListener('click', ()=>window.print());
</script>
