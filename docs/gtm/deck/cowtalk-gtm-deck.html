<title>축산 디지털 운영체제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Gowun+Batang:wght@400;700&display=swap">

<style>
:root{
  --ground:#F2F5F6; --surface:#FFFFFF; --surface-2:#F6F9F9; --surface-3:#EAF1F1;
  --ink:#0B2239; --ink-2:#243B53; --muted:#5A6B76; --faint:#8B9BA5;
  --line:#D6E0E4; --line-strong:#B6C6CD;
  --teal:#0E7C7B; --teal-deep:#095352; --mint:#16B0A6;
  --amber:#B06A16; --amber-soft:#F5EBDC;
  --risk:#A8322F; --risk-soft:#F7E7E6;
  --ok:#0E7C7B;
  --rail:#0B2239; --rail-ink:#DCE7EB; --rail-muted:#7C93A0; --rail-line:#1D3444;
  --shadow:0 1px 2px rgba(11,34,57,.06), 0 8px 28px -12px rgba(11,34,57,.18);
  --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --serif:"Gowun Batang",Batang,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#060F14; --surface:#0D1B23; --surface-2:#112530; --surface-3:#16303C;
    --ink:#E6EFF2; --ink-2:#C4D6DD; --muted:#95A9B3; --faint:#6C838F;
    --line:#1E3743; --line-strong:#2C4B59;
    --teal:#2FBFB4; --teal-deep:#7BD8CF; --mint:#4FD8CC;
    --amber:#E0A052; --amber-soft:#2A2013;
    --risk:#EC7A75; --risk-soft:#2E1614;
    --ok:#2FBFB4;
    --rail:#040C10; --rail-ink:#D2E2E7; --rail-muted:#6F8794; --rail-line:#17303C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#060F14; --surface:#0D1B23; --surface-2:#112530; --surface-3:#16303C;
  --ink:#E6EFF2; --ink-2:#C4D6DD; --muted:#95A9B3; --faint:#6C838F;
  --line:#1E3743; --line-strong:#2C4B59;
  --teal:#2FBFB4; --teal-deep:#7BD8CF; --mint:#4FD8CC;
  --amber:#E0A052; --amber-soft:#2A2013;
  --risk:#EC7A75; --risk-soft:#2E1614;
  --ok:#2FBFB4;
  --rail:#040C10; --rail-ink:#D2E2E7; --rail-muted:#6F8794; --rail-line:#17303C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-weight:400; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul{padding-left:0; list-style:none}
a{color:var(--teal)}

/* ── shell ─────────────────────────────────────────── */
.shell{display:grid; grid-template-columns:236px minmax(0,1fr); min-height:100vh}
.rail{
  background:var(--rail); color:var(--rail-ink);
  padding:26px 20px 40px; position:sticky; top:0; height:100vh;
  overflow-y:auto; border-right:1px solid var(--rail-line);
}
.rail-mark{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--mint)}
.rail-title{font-size:19px; font-weight:600; margin-top:8px; letter-spacing:-.01em; line-height:1.25}
.rail-sub{font-size:11.5px; color:var(--rail-muted); margin-top:7px; line-height:1.5}
.rail-hr{height:1px; background:var(--rail-line); margin:22px 0 16px; border:0}
.rail-label{font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--rail-muted); margin-bottom:10px}
.tracks{display:flex; flex-direction:column; gap:3px}
.track-btn{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  background:none; border:0; border-radius:5px; padding:8px 9px;
  color:var(--rail-ink); font-family:var(--sans); font-size:12.5px; cursor:pointer;
  transition:background .14s ease;
}
.track-btn:hover{background:rgba(255,255,255,.06)}
.track-btn[aria-pressed="true"]{background:rgba(47,191,180,.16); color:#fff}
.track-btn:focus-visible{outline:2px solid var(--mint); outline-offset:1px}
.dot{width:7px; height:7px; border-radius:50%; flex:none; background:currentColor; opacity:.55}
.track-btn[aria-pressed="true"] .dot{opacity:1; background:var(--mint)}
.tcount{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--rail-muted)}
.rail-note{font-size:11px; color:var(--rail-muted); line-height:1.6; margin-top:6px}
.rail-note b{color:var(--rail-ink); font-weight:500}

.stage{padding:34px clamp(16px,3.4vw,52px) 88px; min-width:0}
.stage-head{max-width:1180px; margin:0 auto 26px; display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; justify-content:space-between}
.stage-head h1{font-size:15px; font-weight:600; letter-spacing:-.01em}
.stage-head p{font-size:12.5px; color:var(--muted); margin-top:3px}
.toolbar{display:flex; gap:7px}
.tool{
  font-family:var(--mono); font-size:11px; letter-spacing:.04em;
  background:var(--surface); color:var(--muted); border:1px solid var(--line);
  border-radius:5px; padding:6px 11px; cursor:pointer;
}
.tool:hover{color:var(--ink); border-color:var(--line-strong)}
.tool:focus-visible{outline:2px solid var(--teal); outline-offset:1px}

.deck{max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:30px}
.slide-wrap{display:flex; flex-direction:column; gap:0}
.slide-wrap[hidden]{display:none}

/* ── slide card ───────────────────────────────────── */
.slide{
  container-type:inline-size;
  position:relative; aspect-ratio:16/9; background:var(--surface);
  border:1px solid var(--line); border-radius:3px; box-shadow:var(--shadow);
  padding:4.6cqw 5cqw 4.2cqw; display:flex; flex-direction:column; overflow:hidden;
}
.slide::before{content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--teal)}
.slide.is-cover::before{background:var(--amber)}
.s-top{display:flex; align-items:baseline; gap:1.4cqw; margin-bottom:2.1cqw}
.eyebrow{
  font-family:var(--mono); font-size:1.05cqw; letter-spacing:.16em; text-transform:uppercase;
  color:var(--teal); font-weight:500;
}
.stage-chip{
  margin-left:auto; font-family:var(--mono); font-size:.95cqw; letter-spacing:.1em;
  color:var(--faint); border:1px solid var(--line); border-radius:99px; padding:.3cqw 1cqw;
}
.s-title{font-size:2.55cqw; font-weight:600; line-height:1.28; letter-spacing:-.018em; text-wrap:balance; max-width:88%}
.s-title em{font-style:normal; color:var(--teal)}
.s-lede{font-size:1.34cqw; color:var(--muted); margin-top:1.1cqw; line-height:1.6; max-width:78%}
.s-body{margin-top:2.6cqw; flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:1.6cqw}
.s-foot{
  margin-top:auto; padding-top:1.6cqw; border-top:1px solid var(--line);
  font-size:1.12cqw; color:var(--ink-2); display:flex; gap:1cqw; align-items:baseline;
}
.s-foot .k{font-family:var(--mono); font-size:.95cqw; letter-spacing:.12em; text-transform:uppercase; color:var(--teal); flex:none}
.pageno{position:absolute; right:2.2cqw; bottom:1.6cqw; font-family:var(--mono); font-size:1cqw; color:var(--faint)}

/* content primitives (cqw-scaled) */
.cols{display:grid; gap:1.5cqw; flex:1; min-height:0}
.cols.c2{grid-template-columns:1fr 1fr}
.cols.c3{grid-template-columns:repeat(3,1fr)}
.cols.c4{grid-template-columns:repeat(4,1fr)}
.cols.c25{grid-template-columns:1.25fr 1fr}
.cols.c52{grid-template-columns:1fr 1.6fr}
/* a grid holding a table must not stretch its rows — table rows would fan apart */
.cols:has(> table.t){align-content:center}
.cols:has(> div > table.t){align-content:center}
.s-body > table.t{align-self:start}
.cols > table.t{align-self:start}
.card{
  background:var(--surface-2); border:1px solid var(--line); border-radius:3px;
  padding:1.7cqw 1.8cqw; display:flex; flex-direction:column; gap:.7cqw; min-height:0;
}
.card.accent{background:var(--surface-3); border-color:var(--line-strong)}
.card.warn{background:var(--amber-soft); border-color:var(--amber)}
.card.risk{background:var(--risk-soft); border-color:var(--risk)}
.card .kicker{font-family:var(--mono); font-size:.95cqw; letter-spacing:.14em; text-transform:uppercase; color:var(--teal)}
.card.warn .kicker{color:var(--amber)}
.card.risk .kicker{color:var(--risk)}
.card h4{font-size:1.42cqw; font-weight:600; line-height:1.35; letter-spacing:-.01em}
.card p{font-size:1.12cqw; color:var(--muted); line-height:1.62}
.card p strong{color:var(--ink); font-weight:600}

.bul{display:flex; flex-direction:column; gap:.85cqw}
.bul li{font-size:1.18cqw; line-height:1.6; color:var(--ink-2); padding-left:1.5cqw; position:relative}
.bul li::before{content:""; position:absolute; left:0; top:.72cqw; width:.5cqw; height:.5cqw; border-radius:50%; background:var(--teal)}
.bul li strong{color:var(--ink); font-weight:600}
.bul.dense li{font-size:1.06cqw}

.metrics{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:1.5cqw}
.metric{border-top:2px solid var(--teal); padding-top:1.1cqw; display:flex; flex-direction:column; gap:.35cqw}
.metric.amber{border-color:var(--amber)}
.metric .fig{font-family:var(--mono); font-size:2.9cqw; font-weight:600; letter-spacing:-.02em; line-height:1; font-variant-numeric:tabular-nums}
.metric.amber .fig{color:var(--amber)}
.metric .lab{font-size:1.05cqw; color:var(--muted); line-height:1.45}
.metric.wide .fig{font-size:1.95cqw}

table.t{width:100%; border-collapse:collapse; font-size:1.08cqw}
table.t th{
  text-align:left; font-family:var(--mono); font-size:.92cqw; letter-spacing:.11em;
  text-transform:uppercase; color:var(--teal); font-weight:500;
  padding:0 .9cqw .7cqw 0; border-bottom:1px solid var(--line-strong);
}
table.t td{padding:.72cqw .9cqw .72cqw 0; border-bottom:1px solid var(--line); color:var(--ink-2); vertical-align:top; line-height:1.5}
table.t td strong{color:var(--ink); font-weight:600}
table.t .num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; padding-right:0}
table.t tr:last-child td{border-bottom:0}
table.t tr.sum td{border-top:1px solid var(--line-strong); border-bottom:0; font-weight:600; color:var(--ink)}

.yes{color:var(--ok); font-weight:600}
.no{color:var(--risk); font-weight:600}
.part{color:var(--amber); font-weight:600}

.stack-layers{display:flex; flex-direction:column; gap:.55cqw; flex:1}
.layer{
  display:grid; grid-template-columns:7.5cqw 1fr; gap:1.4cqw; align-items:center;
  border:1px solid var(--line); border-left:3px solid var(--teal);
  background:var(--surface-2); border-radius:2px; padding:1.05cqw 1.4cqw; flex:1;
}
.layer .lno{font-family:var(--mono); font-size:.95cqw; letter-spacing:.1em; color:var(--teal); text-transform:uppercase}
.layer .lname{font-size:1.3cqw; font-weight:600; letter-spacing:-.01em}
.layer .ldesc{font-size:1.04cqw; color:var(--muted); line-height:1.5; margin-top:.18cqw}
.layer .lowner{margin-left:auto; font-family:var(--mono); font-size:.95cqw; color:var(--faint); white-space:nowrap}
.layer .lmain{display:flex; align-items:baseline; gap:1cqw; flex-wrap:wrap}
.layer.l4{border-left-color:var(--amber)} .layer.l4 .lno{color:var(--amber)}
.layer.l3{border-left-color:var(--teal)}
.layer.l2{border-left-color:var(--mint)} .layer.l2 .lno{color:var(--mint)}
.layer.l1{border-left-color:var(--ink-2)} .layer.l1 .lno{color:var(--ink-2)}

.flow{display:flex; align-items:stretch; gap:.8cqw; flex-wrap:nowrap}
.step{
  flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:2px;
  padding:1.2cqw 1.1cqw; display:flex; flex-direction:column; gap:.45cqw; min-width:0;
}
.step .sn{font-family:var(--mono); font-size:.92cqw; color:var(--teal); letter-spacing:.1em}
.step .st{font-size:1.16cqw; font-weight:600; line-height:1.32}
.step .sd{font-size:1cqw; color:var(--muted); line-height:1.5}
.arrow{align-self:center; color:var(--faint); font-size:1.5cqw; flex:none}

.quote{
  font-family:var(--serif); font-size:2.05cqw; line-height:1.5; color:var(--ink);
  border-left:3px solid var(--amber); padding-left:2cqw; max-width:86%; letter-spacing:-.01em;
}
.quote small{display:block; font-family:var(--sans); font-size:1.1cqw; color:var(--muted); margin-top:1.2cqw; letter-spacing:0}

.boundary{border:1px dashed var(--line-strong); border-radius:3px; padding:1.4cqw 1.6cqw; display:flex; flex-direction:column; justify-content:center; gap:.9cqw}
.boundary .bt{font-family:var(--mono); font-size:.95cqw; letter-spacing:.13em; text-transform:uppercase; color:var(--faint)}

/* cover */
.slide.is-cover{justify-content:center; gap:0}
.cover-mark{font-family:var(--mono); font-size:1.1cqw; letter-spacing:.3em; text-transform:uppercase; color:var(--amber)}
.cover-h{font-size:4.4cqw; font-weight:600; letter-spacing:-.03em; line-height:1.12; margin-top:1.6cqw}
.cover-h span{font-family:var(--serif); font-weight:400; color:var(--teal)}
.cover-sub{font-size:1.5cqw; color:var(--muted); margin-top:1.6cqw; max-width:64%; line-height:1.6}
.cover-meta{margin-top:3.2cqw; display:flex; gap:2.6cqw; font-family:var(--mono); font-size:1.02cqw; color:var(--faint); letter-spacing:.04em; flex-wrap:wrap}
.cover-meta b{color:var(--ink-2); font-weight:500}

/* notes */
.notes{
  border:1px solid var(--line); border-top:0; background:var(--surface-2);
  border-radius:0 0 3px 3px; font-size:13px;
}
.notes summary{
  cursor:pointer; padding:9px 16px; font-family:var(--mono); font-size:11px;
  letter-spacing:.13em; text-transform:uppercase; color:var(--muted); list-style:none;
}
.notes summary::-webkit-details-marker{display:none}
.notes summary::before{content:"▸ "; color:var(--teal)}
.notes[open] summary::before{content:"▾ "}
.notes summary:focus-visible{outline:2px solid var(--teal); outline-offset:-2px}
.notes .nbody{padding:2px 20px 18px; color:var(--ink-2); line-height:1.72; max-width:74ch}
.notes .nbody p{margin-bottom:9px}
.notes .nbody p:last-child{margin-bottom:0}
.notes .nbody b{color:var(--ink); font-weight:600}
.notes .nbody .say{
  border-left:2px solid var(--amber); padding-left:12px; font-family:var(--serif);
  font-size:15px; color:var(--ink);
}
.notes .nbody .warnline{color:var(--risk); font-weight:500}

.tag-row{display:flex; gap:5px; padding:7px 16px 0; flex-wrap:wrap}
.tag{font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); border:1px solid var(--line); border-radius:99px; padding:2px 8px}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static; height:auto; padding:20px}
  .tracks{flex-direction:row; flex-wrap:wrap}
  .track-btn{width:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}

/* ── print / PDF ──────────────────────────────────── */
@page{size:1280px 720px; margin:0}
@media print{
  body{background:#fff}
  .rail,.stage-head,.notes,.tag-row{display:none !important}
  .stage{padding:0}
  .deck{max-width:none; gap:0}
  .slide-wrap[hidden]{display:none !important}
  .slide{
    width:1280px; height:720px; aspect-ratio:auto; border:0; border-radius:0;
    box-shadow:none; break-after:page; page-break-after:always;
  }
  .slide::before{background:var(--teal) !important; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
}
</style>

<div class="shell">
  <nav class="rail" aria-label="트랙 선택">
    <div class="rail-mark">CowTalk v5</div>
    <div class="rail-title">축산 디지털<br>운영체제</div>
    <div class="rail-sub">지자체 · 국가 · 전문가 · 해외정부<br>소개 · 교육 · 사업제안 통합덱</div>
    <hr class="rail-hr">
    <div class="rail-label">청중 트랙</div>
    <div class="tracks" id="tracks"></div>
    <hr class="rail-hr">
    <div class="rail-label">발표 전 확인</div>
    <p class="rail-note">
      <b>①</b> 당일 수치는 <code>/api/public/stats</code>로 확인<br>
      <b>②</b> 서버 pre-warm 15분 전<br>
      <b>③</b> 시연 실패 대비 녹화본 준비
    </p>
  </nav>

  <main class="stage">
    <div class="stage-head">
      <div>
        <h1 id="trackName">전체 덱</h1>
        <p id="trackDesc">모든 트랙의 슬라이드를 순서대로 표시합니다.</p>
      </div>
      <div class="toolbar">
        <button class="tool" id="notesBtn" type="button">노트 모두 펼치기</button>
        <button class="tool" id="printBtn" type="button">인쇄 · PDF</button>
      </div>
    </div>
    <div class="deck" id="deck"></div>
  </main>
</div>

<script>
const TRACKS = [
  {id:'all',   name:'전체 덱',            desc:'모든 트랙의 슬라이드를 순서대로 표시합니다.'},
  {id:'core',  name:'공통 · 코어',        desc:'어떤 청중에게도 먼저 말해야 하는 기본 9장.'},
  {id:'local', name:'지역정부 (지자체)',  desc:'예산과 성과. 결재 문장 = "우리 도가 먼저 했다".'},
  {id:'natl',  name:'국가 · 방역기관',    desc:'전국 표준과 데이터 주권. 결재 문장 = "이게 표준이 될 수 있다".'},
  {id:'vet',   name:'전문가 · 거점병원',  desc:'수의사·수정사. 결재 문장 = "대체가 아니라 증폭이다".'},
  {id:'biz',   name:'파트너 · 비즈니스',  desc:'4주체 구조와 수익 모델. 투자·파트너 협상용.'},
  {id:'impact',name:'기대효과 · 환경',    desc:'금액 환산과 탄소·환경. 근거 등급을 붙여 예산 심의에 그대로 쓴다.'},
  {id:'intl',  name:'Overseas (EN)',      desc:'해외 정부 관계자. 결재 문장 = "주권을 지키며 도입 가능하다".'},
];

const S = [];
const add = (o) => S.push(o);

/* ══ COVER ══ */
add({t:['core'], cover:true, body:`
  <div class="cover-mark">Livestock Digital Operating System</div>
  <h2 class="cover-h">소가 말하지 못하는 것을<br><span>국가가 듣는다</span></h2>
  <p class="cover-sub">위내센서 · 공공데이터 · AI 해석 · 역할별 액션플랜을 하나로 묶은
  축산 디지털 운영체제. 한 마리의 소에서 시작해 전국 방역까지 하나의 데이터 척추로 잇습니다.</p>
  <div class="cover-meta">
    <span>CowTalk <b>v5.0</b></span>
    <span>운영 규모 <b>약 200 농장 · 1.1만 두</b></span>
    <span>파일럿 <b>경기도 · 송영신목장</b></span>

add({t:['core','local','natl','biz','impact'], eyebrow:'대전제', stage:'무엇을',

  body:`<table class="t">

  foot:['그래서','미국산 쇠고기는 2017년 이미 수입 쇠고기 시장 1위입니다. 그 제품의 마지막 관세가 사라졌습니다. <strong>"싸게 만들어 이긴다"는 선택지가 구조적으로 닫혔습니다.</strong>'],
  n:`<p><b>이 한 장이 전체 발표의 출발점이다.</b> 제품 이야기를 하기 전에 이걸 먼저 세운다.</p>

add({t:['core','local','natl','impact'], eyebrow:'대전제', stage:'무엇을',

    </table>
  </div>`,
  foot:['가장 무거운 한 줄','<strong>1리터를 생산할수록 손해가 나는 구조에 들어섰습니다.</strong> 원유가는 3년 연속 동결됐고 생산비가 그 위로 올라갔습니다.'],
  n:`<p>오른쪽 마지막 줄(1,252 &gt; 1,249)에서 반드시 멈춘다. <b>이 장의 전부다.</b></p>
     <p class="say">"낙농은 지금 <b>역마진</b>입니다. 짤수록 손해입니다.

     <b>가격을 올려서 풀 수 있는 문제가 아닙니다.</b> 올리면 수입산으로 갑니다."</p>
     <p>지자체 발표라면 여기에 관내 농가 수치를 얹는다. 남의 이야기가 아니라 관내 이야기가 되어야 한다.</p>`});

add({t:['core','local','natl','biz','impact','intl'], eyebrow:'대전제', stage:'그래서',
  title:'남은 경쟁축은 셋. <em>셋 다 데이터가 전제</em>입니다',
  lede:'가격으로 못 이기는 산업이 설 수 있는 자리는 증명·효율·환경뿐입니다. 그리고 셋 다 측정 없이는 불가능합니다.',
  body:`<div class="cols c3">
    <div class="card"><div class="kicker">① 증명</div><h4>안전성·품질·이력을<br>입증한다</h4>
      <p>항생제 휴약, 질병 이력, 사육 과정이 <strong>기록으로 남아야 증명이 된다.</strong> 수출도 여기서 갈린다.</p></div>
    <div class="card"><div class="kicker">② 효율</div><h4>두당 성적을 올려<br>생산비를 낮춘다</h4>
      <p>공태일 하루, 유방염 한 건, 폐사 한 마리가 그대로 원가다. <strong>측정하지 않으면 개선할 수 없다.</strong></p></div>
    <div class="card"><div class="kicker">③ 환경</div><h4>탄소·분뇨를 줄이고<br>인정받는다</h4>
      <p>감축은 <strong>측정·보고·검증(MRV)</strong>이 없으면 실적으로 인정되지 않는다.</p></div>
  </div>
  <div class="card accent"><div class="kicker">결론</div>
    <p><strong>규모의 경제로는 미국·호주를 이길 수 없다. 한국이 갈 수 있는 길은 정밀의 경제다</strong> —
    한 마리를 정확히 관리해 두당 성적으로 격차를 메우는 것. <strong>축산의 디지털 전환은 성장 전략이 아니라 생존 조건이다.</strong></p></div>`,
  n:`<p>이 장에서 <b>제품 이야기로 넘어가는 다리</b>가 놓인다. 여기까지 오면 청중은 "그래서 뭘 하면 되나"를 묻는 상태가 된다.</p>
     <p class="say">"'싸게'는 이제 우리 선택지가 아닙니다. <b>'정확하게'가 우리 선택지입니다.</b>
     그리고 정확하려면 재야 합니다."</p>
     <p><b>대상별 강조점:</b> 지자체는 ②, 중앙정부는 ①③, 수의계는 ②, 해외정부는 ①.</p>`});

add({t:['core'], eyebrow:'제언', stage:'무엇을',
  title:'축산의 위기는 데이터의 위기다. <em>보이지 않는 것은 관리할 수 없다.</em>',
  lede:'사람이 줄고, 질병은 늦게 발견되고, 데이터는 있는데 연결되지 않는다. 세 문제는 하나의 뿌리를 갖는다.',
  body:`<div class="cols c3">
    <div class="card"><div class="kicker">벽 1 · 사람</div><h4>지키는 사람이 사라진다</h4>
      <p>축산 현장 고령화, 대동물 수의사 감소. 왕진 한 건에 왕복 두 시간. <strong>사람이 주는 속도를 기술이 못 따라가면 축산은 관리 불능이 된다.</strong></p></div>
    <div class="card"><div class="kicker">벽 2 · 질병</div><h4>항상 늦게 발견된다</h4>
      <p>소는 아프다고 말하지 않는다. 눈에 보일 때는 늦다. <strong>첫 신고 시점에 확산은 이미 시작된 상태</strong>다. 방역은 사후 대응의 반복이 된다.</p></div>
    <div class="card"><div class="kicker">벽 3 · 데이터</div><h4>있는데 닿지 않는다</h4>
      <p>이력제·등급·DHI·KAHIS·기상이 전부 존재한다. 그런데 <strong>농가 한 사람이 그걸 자기 소 한 마리에 연결하는 일은 불가능</strong>하다.</p></div>
  </div>`,
  n:`<p>이 장은 <b>공감을 사는 장</b>이다. 우리 제품 얘기를 아직 하지 않는다.</p>
     <p>청중이 지자체·국가면 벽 2(질병)에 무게를 싣고, 수의계면 벽 1(사람)에 싣는다. 농가면 벽 3(데이터)이다.</p>
     <p class="say">"이 세 가지 중 여러분이 가장 아프신 게 뭡니까?" — 이렇게 물으면 나머지 발표의 방향이 잡힌다.</p>`});

add({t:['core'], eyebrow:'해법', stage:'어떻게',
  title:'세계 최고의 센서도 <em>"그래서 뭘 해야 하나"</em>에는 답하지 않는다',
  lede:'위내센서는 이미 존재한다. 문제는 알람과 행동 사이에 다리가 없다는 것이다. CowTalk은 그 다리다.',
  body:`<div class="flow">
    <div class="step"><div class="sn">01 감지</div><div class="st">발정 감지</div><div class="sd">위내센서가 체온·활동량 변화를 포착</div></div>
    <div class="arrow">→</div>
    <div class="step"><div class="sn">02 판단</div><div class="st">맥락 결합</div><div class="sd">이력·산차·최근 치료·목장 설정을 한 화면에</div></div>
    <div class="arrow">→</div>
    <div class="step"><div class="sn">03 추천</div><div class="st">수정 적기 · 정액</div><div class="sd">내일 06시, 추천 정액과 그 근거</div></div>
    <div class="arrow">→</div>
    <div class="step"><div class="sn">04 행동</div><div class="st">현장 실행</div><div class="sd">수정사에게 전달, 정액 공급</div></div>
    <div class="arrow">→</div>
    <div class="step"><div class="sn">05 학습</div><div class="st">결과 피드백</div><div class="sd">임신감정 결과가 다음 추천을 정확하게</div></div>
  </div>`,
  foot:['핵심','알람 → 판단 → 추천 → 행동 → 기록이 <strong>한 화면에서 끝난다.</strong> 이것이 CowTalk이 존재하는 유일한 이유다.'],
  n:`<p>이 장이 <b>전체 덱의 심장</b>이다. 다른 걸 다 잊어도 이 다섯 칸은 기억하게 만든다.</p>
     <p class="say">"발정 알람이 왔습니다. 그래서요? 지금까지는 목장주가 혼자 판단했습니다.
     언제 수정할지, 어떤 정액을 쓸지, 이 소가 지난달 유방염 치료했는데 괜찮은지 — 아무도 알려주지 않았습니다."</p>
     <p>05(학습) 칸을 손가락으로 짚으면서 말한다: "그리고 결과가 돌아와야 다음이 정확해집니다. 이게 순환 구조입니다."</p>`});

add({t:['core'], eyebrow:'구조', stage:'어떻게',
  title:'센서 위에 <em>세 개의 레이어</em>를 얹는다',
  lede:'smaXtec을 복제하지 않는다. 그 위에 공공데이터·AI·다중역할을 쌓아 계층을 다르게 한다.',
  body:`<div class="stack-layers">
    <div class="layer l4"><div class="lno">Layer 4</div><div><div class="lmain"><div class="lname">Intelligence Loop — 쓸수록 똑똑해진다</div><div class="lowner">피드백 · 정확도 추적</div></div><div class="ldesc">전문가 레이블 축적 · 프롬프트 자기보정 · 치료결과 자동 추적</div></div></div>
    <div class="layer l3"><div class="lno">Layer 3</div><div><div class="lmain"><div class="lname">역할별 서빙 — 같은 데이터, 네 개의 관점</div><div class="lowner">농가 · 수의사 · 방역관 · 행정</div></div><div class="ldesc">권한 경계가 게이트웨이 수준에서 강제된다</div></div></div>
    <div class="layer l2"><div class="lno">Layer 2</div><div><div class="lmain"><div class="lname">AI 해석 — 재판단하지 않고 맥락을 붙인다</div><div class="lowner">설명 · 근거 필수</div></div><div class="ldesc">모든 판단에 explanation + 기여요인 + 출처 기록. AI 불가 시 룰 엔진 대체</div></div></div>
    <div class="layer l1"><div class="lno">Layer 1</div><div><div class="lmain"><div class="lname">데이터 통합 — 흩어진 것을 한 마리에 모은다</div><div class="lowner">센서 · 공공 · 기록 · 기상</div></div><div class="ldesc">위내센서 이벤트 + 이력제·등급·경락 + 농장기록 + 기상 THI</div></div></div>
  </div>`,
  n:`<p>아래에서 위로 설명한다. 1층부터. 위로 갈수록 가치가 커진다는 감각을 준다.</p>
     <p><b>2층에서 반드시 짚을 것:</b> "센서 제조사가 검증한 이벤트는 재판단하지 않습니다.
     우리가 다시 뒤집으면 정확도만 떨어집니다. 우리가 하는 건 <b>맥락을 붙이는 것</b>입니다."</p>
     <p>4층이 나오면 대부분 "정말 학습됩니까?"를 묻는다. → 전문가 레이블 슬라이드로 넘길 준비를 해둔다.</p>`});

add({t:['core','vet','impact'], eyebrow:'기술', stage:'어떻게',
  title:'소의 <em>위 속</em>에서 재면 날씨에 흔들리지 않습니다',
  lede:'첫째·둘째 위 사이에 캡슐 센서를 경구 투여하면 가라앉아 평생 그 자리에 머뭅니다. 소는 이물감을 느끼지 않습니다.',
  body:`<div class="cols c52">
    <div class="card accent"><div class="kicker">무엇을 재나</div><h4>심부체온 · 활동량 · 음수 · 반추</h4>
      <p><strong>심부체온</strong> — 발열(질병) · 분만 임박(체온 하강) · 열스트레스<br>
      <strong>활동량</strong> — 발정 행동 · 활동 저하<br>
      <strong>음수 이벤트</strong> — 급수 문제와 식욕 저하의 조기 신호<br>
      <strong>반추 패턴</strong> — 소화기 이상 · 사료 적응</p>
      <p>물을 마시면 위 온도가 일시적으로 떨어진다. <strong>이 보정이 제조사의 핵심 기술</strong>이고, 우리가 센서 이벤트를 재판단하지 않는 이유다.</p></div>
    <div class="bul">
      <li><strong>심부체온은 다른 방법으로 못 잰다</strong> — 피부·귀 온도는 외기온에 끌려다닌다. 위 속은 항온 환경이라 <strong>미세한 변화가 진짜 생리 변화</strong>다</li>
      <li><strong>탈락률이 0에 수렴한다</strong> — 목걸이는 벗겨지고 이표는 떨어진다. 센서 없는 소는 데이터 없는 소이고, <strong>방역 감시망의 구멍</strong>이 된다</li>
      <li><strong>생애 단위 시계열이 쌓인다</strong> — 배터리 교체 없이 수년. AI가 <strong>"이 소의 평소"</strong>를 알아야 이상을 안다</li>
    </div>

add({t:['core','vet','impact'], eyebrow:'기술 선택', stage:'어떻게',

  foot:['정직한 결론','<strong>체온 기반 사건(질병·분만)은 볼루스가, 행동 기반 사건(발정)은 가속도계가 강합니다.</strong> 볼루스는 둘을 한 디바이스로 덮지만, 발정 탐지 단독으로는 목걸이가 낫습니다.'],

add({t:['core','natl'], eyebrow:'데이터 통합', stage:'어떻게',

add({t:['core'], eyebrow:'역할', stage:'어떻게',

add({t:['core'], eyebrow:'정직성', stage:'그래서',

  n:`<p>03(SEIR) 카드에서 멈춘다. 여기가 이 장의 무게중심이다.</p>
     <p class="say">"이건 그림이 아니라 미분방정식 계산 결과입니다. 이동제한을 걸었을 때와 안 걸었을 때
     며칠 뒤에 몇 농가 차이가 나는지를 숫자로 냅니다. 행정 결정에 근거가 생기는 겁니다."</p>
     <p><b>주의:</b> 시뮬레이션 파라미터(R0 등)는 질병별 문헌값이다. "우리가 예측한다"가 아니라 "표준 모형으로 계산한다"고 말한다.</p>`});

add({t:['local','impact'], eyebrow:'근거', stage:'그래서 · 결과 ②',
  title:'숫자마다 <em>어디서 왔는지</em>를 함께 드립니다',
  lede:'A는 공표 통계, B는 문헌 범위의 하한, C는 우리 가정. 등급이 낮은 것은 낮다고 표시했습니다.',
  body:`<table class="t">
    <thead><tr><th>등급</th><th>의미</th><th>이 계산에서 쓴 예</th><th class="num">값</th></tr></thead>
    <tbody>
      <tr><td><strong class="yes">A</strong></td><td>정부·공공기관 공표 통계</td><td>원유 기본가격 (낙농진흥회, 3년 연속 동결)</td><td class="num">1,084원/L</td></tr>
      <tr><td><strong class="yes">A</strong></td><td>정부·공공기관 공표 통계</td><td>젖소 분뇨 배출원단위 (농촌진흥청)</td><td class="num">28kg/두/일</td></tr>
      <tr><td><strong class="yes">A</strong></td><td>정부·공공기관 공표 통계</td><td>가축전염병 살처분 보상금 (2019~2024, 4개 질병)</td><td class="num">5,289억</td></tr>
      <tr><td><strong class="part">B</strong></td><td>문헌 범위의 <strong>하한</strong> 채택</td><td>유방염 1건 손실 (문헌 30~50만원)</td><td class="num">300,000원</td></tr>
      <tr><td><strong class="part">B</strong></td><td>문헌 범위의 <strong>하한</strong> 채택</td><td>공태일 단축 (활동량센서 문헌 5~15일)</td><td class="num">5일</td></tr>
      <tr><td><strong class="no">C</strong></td><td>우리 설계 가정 — <strong>파일럿 검증 대상</strong></td><td>육성우 감축률 · 탄소 사회적비용 단가</td><td class="num">15~45% / 10만원</td></tr>
    </tbody>
  </table>`,
  foot:['출처','단가는 발표용으로 만든 숫자가 아니라 <strong>제품이 매일 경제 계산에 실제로 쓰는 파라미터 카탈로그</strong>이며, 농장별로 수정 가능합니다.'],
  n:`<p><b>이 장이 예산 심의의 승부처다.</b> 여기서 등급을 구분해 발음하지 않으면 뒤의 모든 숫자가 한 덩어리로 의심받는다.</p>
     <p class="say">"저희 숫자는 세 종류입니다. 공표 통계, 문헌 하한, 그리고 저희 가정입니다.
     <b>어느 것이 어느 것인지 표시해서 드리겠습니다.</b>"</p>
     <p>B등급에서 <b>"하한을 썼다"</b>는 점을 반드시 짚는다. 문헌이 5~15일인데 5일을 썼다는 사실이
     나머지 전부의 신뢰를 만든다.</p>`});

add({t:['local','impact'], eyebrow:'정정', stage:'그래서 · 결과 ②',
  title:'발표 전에 <em>저희 숫자 6건을 스스로 고쳤습니다</em>',
  lede:'공개 통계와 대조하고 계산 정합성을 검토한 결과입니다. 대부분 유리한 방향이지만, 틀린 건 틀린 것입니다.',
  body:`<table class="t">
    <thead><tr><th>기존 브리핑</th><th>실제 (공표 통계)</th><th>영향</th></tr></thead>
    <tbody>
      <tr><td>경기 젖소 <strong>100,000두</strong></td><td><strong>150,364두</strong> (2026.3 축산물이력제)</td><td>사업 규모 1.5배 — 100,000두는 <strong>보급률 67% 시나리오</strong>로 재정의</td></tr>
      <tr><td>경기 낙농가 <strong>1,500호</strong></td><td>전국 5,313호 · 목장당 69~70두<br>→ 경기 추정 <strong>약 2,100호</strong></td><td>기지국 구축비 75억 → <strong>약 107억</strong> 재산정</td></tr>
      <tr><td>젖소 두수 기준연도 불명확</td><td>전국 36.5~37.5만두 (2026)<br>3년새 농가 <strong>9.7% 감소</strong></td><td>경기 비중 <strong>40.6%</strong> — "전국 최대 낙농 거점" 표현은 정확</td></tr>
      <tr><td>육성우 감축을 <strong>8만두 전체</strong>에 적용</td><td>감축은 <strong>보급된 농가에서만</strong> 발생</td><td>사회·환경 편익 하향</td></tr>
      <tr><td>두당 월 <strong>15,000원</strong> (설계 가정)</td><td><strong>현행 실단가 12,000원</strong><br><sub>수입사 지급 7,700원 · D2O 4,300원</sub></td><td>연 비용 180억 → <strong>144억</strong>. BCR 상승</td></tr>
      <tr><td>경기 육성우 <strong>80,000두</strong> (근거 없는 추정)</td><td>공표통계 유도 → <strong>약 66,000두</strong><br><sub>전국 젖소 37.1만 − 착유우 19.1만에서 유도, 범위 5.9~7.3만</sub></td><td>대상 육성우 <strong>44,200두</strong>로 확정</td></tr>
    </tbody>
  </table>`,
  foot:['왜 먼저 말하나','우리가 우리 숫자를 고쳐 왔다는 사실 자체가, 남은 숫자에 대한 <strong>가장 강한 신뢰 근거</strong>입니다.'],
  n:`<p><b>이 슬라이드를 빼자는 제안이 반드시 나온다. 절대 빼지 마라.</b></p>
     <p>심의위원은 "이 사람들이 자기 숫자를 검증하는가"를 본다. 4건을 스스로 고쳐 왔다는 것은
     나머지 숫자도 같은 방식으로 검증됐다는 증거가 된다.</p>
     <p class="say">"발표 준비하면서 저희 숫자를 공개 통계와 다시 대조했습니다. 4건이 틀렸습니다. 먼저 정정하고 시작하겠습니다."</p>`});

add({t:['local','impact'], eyebrow:'ROI', stage:'그래서 · 결과 ②',

  lede:'경기 젖소 150,364두 중 100,000두 보급(약 67%) · 두당 월 12,000원(현행 실단가) · 연 구독비용 144억 기준.',
  body:`<table class="t">

    <tbody>
      <tr><td>농가 개체 편익 (두당 8.05만 / 20.5만 / 24만원)</td><td class="num">80.5억</td><td class="num">204.7억</td><td class="num">240.0억</td></tr>
      <tr><td>육성우 감축 — 사료비 절감</td><td class="num">79.6억</td><td class="num">159.2억</td><td class="num">238.8억</td></tr>
      <tr><td>육성우 감축 — 분뇨 처리비</td><td class="num">15.9억</td><td class="num">31.8억</td><td class="num">47.8억</td></tr>
      <tr><td>육성우 감축 — 탄소 (시장가 / 중간 / 사회적비용)</td><td class="num">2.0억</td><td class="num">11.9억</td><td class="num">59.7억</td></tr>
      <tr><td>방역 (옵션가치)</td><td class="num">계상 안 함</td><td class="num">30억</td><td class="num">30억</td></tr>
      <tr class="sum"><td>연간 총편익 / 비용 144억</td><td class="num">178.0억</td><td class="num">437.6억</td><td class="num">616.3억</td></tr>
    </tbody>
  </table>
  <div class="metrics">
    <div class="metric amber"><div class="fig">1.24</div><div class="lab">A 보수 — <strong>이 숫자로 말합니다</strong></div></div>
    <div class="metric"><div class="fig">3.04</div><div class="lab">B 기준 (문헌 중간값)</div></div>

  </div>`,
  n:`<p><b>1.24를 먼저 말한다.</b> 4.28을 먼저 말하면 나머지가 다 의심받는다. 순서가 전부다.</p>
     <p><b>현행 실단가 12,000원</b>을 쓴다는 점을 밝힌다 — 손익분기 요금이 14,800원이므로 2,800원의 여유가 있다.</p>
     <p class="say">"가장 보수적으로 잡아도 1.1입니다. 저희는 이 숫자로 말씀드리겠습니다. 나머지는 파일럿이 증명할 몫입니다."</p>
     <p><b>반드시 함께 밝힐 것:</b> 개체 편익만 보면 보수 시나리오는 BCR 0.45로 미달한다.
     이 사업의 정당성은 농가 수익이 아니라 <b>자원효율</b>에 있다. 이걸 먼저 말하면 공격이 들어올 자리가 사라진다.</p>`});

add({t:['impact'], eyebrow:'민감도', stage:'그래서 · 결과 ②',

  foot:['시사점','① <strong>육성우를 실제로 줄일 수 있는가</strong> ② <strong>두당 요금을 얼마로 협상하는가</strong>. 나머지 정밀도를 높이는 데 시간을 쓸 이유가 없습니다.'],
  n:`<p>이 장은 <b>우리가 우리 모델의 약점을 안다</b>는 증명이다. 심의위원이 가장 좋아하는 슬라이드다.</p>
     <p>5위(탄소 단가)를 짚으며 한 마디: "탄소 단가는 논쟁이 가장 뜨거운데 <b>BCR 영향은 가장 작습니다.</b>
     그 논쟁에 시간을 쓰지 않으셔도 됩니다."</p>

add({t:['local','natl','impact'], eyebrow:'탄소 · 기후', stage:'그래서 · 결과 ③',
  title:'축산은 <em>감축 수단이 없는데</em> 30%를 줄여야 합니다',
  lede:'2030 NDC — 국가 40%, 농축수산 25.9%, 축산 분야 30% 감축. 그런데 축산의 배출은 생물의 대사입니다.',
  body:`<div class="cols c52">
    <div class="card risk"><div class="kicker">구조적 난제</div><h4>연료를 바꾸듯<br>바꿀 수가 없다</h4>
      <p>제조업은 연료를, 발전은 전원을 바꾸면 된다. 축산은 소가 되새김하며 내는 메탄이다.
      저메탄 사료·분뇨처리 고도화는 <strong>단위당 저감</strong>이고 농가에 비용을 지운다.</p></div>
    <div class="card accent"><div class="kicker">CowTalk의 경로</div><h4>한 마리가 덜 배출하게 하는 대신<br>더 적은 소로 같은 우유를</h4>
      <p>번식효율↑ · 생애수명↑ → 대체 후보축(육성우) 수요↓ → <strong>사육두수↓, 생산량 유지</strong>.
      육성우는 2년간 생산 없이 먹고 배출한다. 그 두수가 줄면 사료·분뇨·메탄이 동시에 준다.</p>
      <p><strong>환경 성과를 위해 새로 할 일이 없다. 번식·건강을 잘하면 환경이 따라온다.</strong></p></div>
  </div>`,
  foot:['가장 강한 한 문장','<strong>농가에 비용을 부담시키지 않고 축산 온실가스를 줄이는 거의 유일한 수단입니다.</strong>'],
  n:`<p><b>정책 담당자에게 규모감을 주는 비교:</b> 젖소 한 마리는 연 약 4.2톤 CO₂eq를 배출한다.
     승용차 1대가 약 2톤이다. <b>젖소 한 마리 = 승용차 두 대.</b></p>
     <p>4.2톤은 공표된 두당 계수가 아니라 <b>총량과 축종별 기여율에서 역산한 유도값</b>이다.
     유도 과정을 공개했다고 반드시 밝힌다 (등급 C).</p>
     <p class="say">"축산에 30% 감축 목표를 주셨는데, 쓸 수 있는 수단이 많지 않습니다. 하나 더 드리겠습니다."</p>`});

add({t:['local','natl','impact'], eyebrow:'환경부담', stage:'그래서 · 결과 ③',
  title:'탄소보다 먼저 <em>악취 민원</em>이 줄어듭니다',
  lede:'분뇨의 87%가 농경지에 살포되고, 악취 민원의 절반이 거기서 나옵니다. 총량이 줄면 원인 물질이 줍니다.',
  body:`<table class="t">
    <thead><tr><th>육성우 감축</th><th class="num">탄소 저감</th><th class="num">경기 젖소 2030<br>감축목표 대비</th><th class="num">분뇨 감소</th><th class="num">사료비 절감</th></tr></thead>
    <tbody>
      <tr><td><strong>15%</strong> · 6,630두 (보수)</td><td class="num">2.0만톤</td><td class="num"><strong>약 11%</strong></td><td class="num">5.3만톤</td><td class="num">79.6억</td></tr>
      <tr><td><strong>30%</strong> · 13,270두 (기준)</td><td class="num">4.0만톤</td><td class="num"><strong>약 21%</strong></td><td class="num">10.6만톤</td><td class="num">159.2억</td></tr>
      <tr><td><strong>45%</strong> · 19,900두 (적극)</td><td class="num">6.0만톤</td><td class="num"><strong>약 32%</strong></td><td class="num">15.9만톤</td><td class="num">238.8억</td></tr>
    </tbody>
  </table>
  <div class="cols c3">
    <div class="card"><div class="kicker">분뇨 총량</div><p>전국 연 <strong>5,073만톤</strong> 중 젖소 9.1%. 퇴비 75.3% · 액비 11.7%가 <strong>농경지로 간다</strong></p></div>
    <div class="card"><div class="kicker">질소 · 인 부하</div><p>분뇨 감소에 비례해 수질 오염 부하 저감. <strong>살포 가능 농지 제약도 완화</strong></p></div>
    <div class="card"><div class="kicker">사료 자원</div><p>수입 조사료·곡물 의존도 감소 → <strong>식량안보에도 기여</strong></p></div>
  </div>`,
  n:`<p><b>순서를 바꿔 말한다.</b> 지자체 담당자에게는 탄소보다 악취가 급하다.</p>
     <p class="say">"분뇨가 연 10.6만톤 줄어듭니다. 그 87%가 농경지에 뿌려지던 것이고,
     악취 민원의 절반이 거기서 나옵니다. <b>탄소는 그 다음 이야기입니다.</b>"</p>

add({t:['vet'], eyebrow:'책임 경계', stage:'어떻게',

    <div class="card accent"><div class="kicker">After</div><h4>큐를 보고 출발한다</h4>

  </div>`,
  n:`<p class="warnline">숫자는 <b>설계 목표치</b>다. "시범사업으로 검증할 목표 지표"라고 반드시 말한다. 실측이라고 하면 안 된다.</p>

add({t:['vet'], eyebrow:'학습 루프', stage:'그래서',
  title:'선생님의 판단이 <em>사라지지 않고 자산이 된다</em>',

  body:`<div class="flow">

  foot:['데이터 위생','<strong>농장주와 행정관의 추측은 학습에서 제외된다.</strong> 전문가 판단만 정답 레이블로 쓴다 — 학습 데이터를 오염시키지 않기 위해서다.'],
  n:`<p><b>수의계 대상 발표의 클로징 감정을 만드는 장이다.</b></p>
     <p class="say">"선생님이 은퇴하시면 그 판단들이 어디로 갑니까? 지금은 사라집니다.

  n:`<p><b>M3 기준선 측정</b>을 강조한다. 대부분의 시범사업이 여기를 건너뛰고 나중에 성과를 증명하지 못한다.</p>

add({t:['biz'], eyebrow:'파트너 구조', stage:'무엇을',

add({t:['biz'], eyebrow:'수익 모델', stage:'그래서',
  title:'농가에 <em>구독</em>, 정부에 <em>인프라</em>, 해외에 <em>운영체제</em>',
  lede:'①이 데이터를 만들고 ②③이 규모를 만들고 ⑤⑥이 마진을 만든다. 셋이 같이 가야 성립한다.',
  body:`<table class="t">

  n:`<p>⑤(데이터 인텔리전스)는 <b>정부·농가 청중 앞에서는 조심스럽게</b> 다룬다. "데이터 팔아서 돈 버는구나"로 읽히면 위험하다.

add({t:['biz'], eyebrow:'판매 구조', stage:'그래서',
  title:'농가에게 팔지 말고, <em>농가를 위해 지자체에 팔아라</em>',
  lede:'같은 데이터가 네 곳에서 서로 다른 이유로 값이 매겨집니다. 이 플랫폼의 사업성은 거기서 나옵니다.',
  body:`<table class="t">
    <thead><tr><th>역할</th><th>그가 진짜 사는 것</th><th>지불 주체</th><th class="num">가격 (기준선)</th><th class="num">우선순위</th></tr></thead>

      <tr><td>국가 · 방역기관</td><td>조기감시망 · 데이터 주권</td><td>국비</td><td class="num">구축 SI + 연 운영</td><td class="num">4</td></tr>
      <tr><td>해외 정부</td><td>주권 지키며 도입</td><td>국가 예산 / ODA</td><td class="num">라이선스 + 로열티</td><td class="num">5</td></tr>

    </tbody>

  foot:['왜 이 순서인가','낙농은 <strong>역마진</strong>이고 50두 미만이 41%입니다. 농가 직접 판매로는 흑자 규모(3~5만두)에 도달할 수 없습니다. <strong>한 번의 계약으로 수천 두가 붙는 채널만 우선 팝니다.</strong>'],
  n:`<p><b>이 장은 투자자·파트너 앞에서만 연다.</b> 지자체 앞에서 "당신이 지불자"라고 말하는 건 무례하다.</p>

     <p><b>경영 리스크:</b> 주력 채널(지자체)의 입금이 가장 느리다(6~18개월). 운전자금 계획이 필요하다.</p>

     환경 부처의 감축 실적입니다."</p>`});

        <tr><td><sub>↳ smaXtec 몫 (추정)</sub></td><td><sub>제조 · 데이터 해석</sub></td><td class="num"><sub>약 6,220</sub></td><td class="num"><sub>51.8%</sub></td></tr>

    </table>
    <div>
      <div class="card"><div class="kicker">설치 매출 (1회)</div><h4>500만원 / 목장</h4>

  foot:['협상 과제','매출의 <strong>64.2%가 수입 단가</strong>다. <strong>볼륨 구간별 단가 테이블</strong>이 계약에 없으면 두수가 늘어도 규모의 이점이 D2O에 오지 않는다.'],
  n:`<p class="warnline"><b>이 장은 대외 배포 금지.</b> 투자자·파트너 협상 자리에서만 연다.

add({t:['biz','natl'], eyebrow:'미해결 과제', stage:'그래서',
  title:'데이터센터 운영사와 <em>데이터 주권 귀속</em>이 아직 없습니다',
  lede:'기술 과제가 아니라 계약·거버넌스 과제입니다. 늦게 정할수록 비싸집니다.',
  body:`<div class="cols c3">
    <div class="card"><div class="kicker">안 A</div><h4>D2O 보관</h4>
      <p>D2O가 계약한 IDC·클라우드.<br><strong>장점</strong> 빠르고 통제가 쉽다<br>
      <strong class="no">단점</strong> 공공 심의 통과가 어렵다. "민간이 국가 방역 데이터를 보유" 논란</p></div>
    <div class="card accent"><div class="kicker">안 B · 국내 권장</div><h4>공공 인프라 위탁</h4>
      <p>지자체·공공기관 클라우드에 적재.<br><strong class="yes">장점</strong> 심의 통과 유리 · 농가 신뢰 확보<br>
      <strong>단점</strong> 조달 절차 · 유연성 저하</p></div>
    <div class="card"><div class="kicker">안 C · 수출 권장</div><h4>합작 SPC</h4>
      <p>데이터센터 운영 법인 별도 설립.<br><strong class="yes">장점</strong> 중립성 · 수익 공유 · <strong>국가별 복제 가능</strong><br>
      <strong>단점</strong> 설립 비용 · 지분 협상</p></div>
  </div>`,
  foot:['원칙','어느 안이든 <strong>SW 운영 주체(D2O)와 데이터 보관 주체를 분리</strong>한다. 이 분리가 없으면 지자체 심의도 해외 계약도 통과하지 못한다.'],
  n:`<p><b>왜 지금 정해야 하는가</b> — 네 가지가 전부 여기에 걸려 있다:
     지자체·국가 계약의 전제 / 해외 수출의 전제 / 농가 신뢰의 전제 / 파트너 협상의 전제.
     <b>나중에 정하면 상대의 협상력이 커진 뒤가 된다.</b></p>
     <p><b>권장 경로:</b> 국내는 B로 시작 → 규모가 커지면 C로 전환. 해외는 처음부터 C.</p>
     <p><b>업체 선정 시 계약에 반드시 넣을 것:</b> 국내 리전 명시 · 감사로그 보존기간과 열람권한 ·
     DR SLA · 공공조달 등록 여부 · <b>계약 종료 시 데이터 반환·파기 절차</b> · 두수 증가 시 단가 체감 구조.</p>`});

add({t:['biz','natl'], eyebrow:'데이터 소유권', stage:'어떻게',
  title:'데이터는 층마다 <em>주인이 다르다</em>',
  lede:'가장 먼저 합의해야 하고, 가장 크게 보여줘야 하는 조항. 이게 없으면 지자체 심의도 해외 계약도 통과하지 못한다.',
  body:`<div class="cols c25">
    <table class="t">
      <thead><tr><th>데이터 계층</th><th>소유자</th><th class="num">반출</th></tr></thead>
      <tbody>
        <tr><td>원시 센서 측정치</td><td><strong>농가</strong></td><td class="num"><span class="no">✗</span></td></tr>
        <tr><td>개체 마스터 (이력 · 혈통)</td><td>국가 공공데이터</td><td class="num"><span class="part">약관 범위</span></td></tr>
        <tr><td>진료 · 처방 기록</td><td><strong>농가 + 수의사</strong></td><td class="num"><span class="no">✗</span></td></tr>
        <tr><td>AI 해석 결과</td><td>플랫폼 (농가 열람권 보장)</td><td class="num"><span class="no">✗</span></td></tr>
        <tr><td>전문가 레이블</td><td>플랫폼 (익명화 후)</td><td class="num"><span class="part">익명 집계</span></td></tr>
        <tr><td>지역 · 전국 집계 통계</td><td><strong>공공</strong></td><td class="num"><span class="yes">○</span></td></tr>
      </tbody>
    </table>
    <div class="card accent"><div class="kicker">합의문 4문장</div>
      <ul class="bul dense">
        <li>농가는 언제든 <strong>자기 데이터를 내보내고 삭제 요청</strong>할 수 있다</li>
        <li>플랫폼은 원시 데이터를 <strong>서비스 제공 목적 외로 사용하지 않는다</strong></li>
        <li>제3자 제공은 <strong>옵트인 · 익명화 · 집계 세 조건을 모두</strong> 만족할 때만</li>
        <li>계약 종료 시 데이터는 <strong>반환되고 플랫폼 사본은 파기</strong>된다</li>
      </ul></div>
  </div>`,
  n:`<p>오른쪽 4문장을 <b>소리 내어 하나씩 읽는다.</b> 이 장은 빨리 넘기지 않는다.</p>
     <p>"회사가 없어지면 우리 데이터는요?"라는 질문에 대한 답이 여기 있다 —
     <b>"데이터센터 주체를 분리한 이유가 이것이기도 합니다. 보관 주체가 공공이면 저희가 없어져도 데이터는 남습니다."</b></p>`});

add({t:['intl'], eyebrow:'Overseas', stage:'What',
  title:'Three walls every livestock nation is hitting',
  lede:'The workforce is shrinking, disease is always found late, and the data exists but never reaches the decision.',
  body:`<div class="cols c3">
    <div class="card"><div class="kicker">Wall 1 · People</div><h4>The workforce is disappearing</h4>
      <p>Large-animal veterinarians are aging out and few replace them. Two hours of driving for one farm visit. <strong>When people leave faster than technology arrives, livestock becomes unmanageable.</strong></p></div>
    <div class="card"><div class="kicker">Wall 2 · Disease</div><h4>Always found too late</h4>
      <p>Cattle do not report illness. By the time it is visible, it is late. <strong>At the moment of first notification, spread has already begun.</strong></p></div>
    <div class="card"><div class="kicker">Wall 3 · Data</div><h4>Present but disconnected</h4>
      <p>Traceability, grading, milk recording, disease reporting — all exist. <strong>No single farmer can connect them to one animal.</strong></p></div>
  </div>`,
  n:`<p>Open with the problem, never with the company. Officials have seen a hundred vendor decks.</p>
     <p class="say">"We are not here to sell you a farm app. We are here to show you how a country can see an outbreak <b>before it is reported.</b>"</p>
     <p>For <b>Southeast Asia</b>, weight Wall 2 (disease containment). For <b>the Gulf</b>, weight Wall 3 and reframe it as food security visibility.</p>`});

add({t:['intl'], eyebrow:'Sovereignty', stage:'How',
  title:'Code flows out. <em>Data never does.</em>',
  lede:'A sovereign instance runs inside your national infrastructure. We export an operating system, not your data.',
  body:`<div class="cols c52">
    <div class="card accent"><div class="kicker">Deployment</div><h4>One codebase,<br>national instances</h4>
      <p>Each country runs its own instance: local database, local computation, local audit trail.
      Updates flow from the core; <strong>data never flows back.</strong></p></div>
    <div class="boundary">
      <div class="bt">Export Boundary</div>
      <div class="card" style="background:var(--surface);border-color:var(--line)"><div class="kicker" style="color:var(--risk)">Never leaves your borders</div>
        <p>Raw sensor data · animal identifiers · farm identifiers · clinical and prescription records</p></div>
      <div class="card" style="background:var(--surface);border-color:var(--line)"><div class="kicker">Crosses only with your approval</div>
        <p>Anonymized, aggregated statistics — and only when opt-in, anonymization and aggregation all hold.</p></div>
    </div>
  </div>`,
  foot:['Say it first','Raise sovereignty <strong>before they ask.</strong> Answered on request it reads as defense; offered first it reads as design.'],
  n:`<p>This is <b>the single most important slide for any overseas government audience.</b> Spend time here.</p>
     <p class="say">"Your data stays inside your borders. What crosses the boundary is anonymized aggregate statistics, and only with your approval."</p>
     <p>Geopolitics matters here but is never said out loud — <b>show it through the architecture</b>, do not claim it.</p>`});

add({t:['intl'], eyebrow:'Localization', stage:'How',
  title:'Not a Korean system with <em>translated menus</em>',
  lede:'Four adapter layers let a country plug in. Water buffalo, zebu, desert heat index — these are parameters, not rewrites.',
  body:`<table class="t">
    <thead><tr><th>Adapter</th><th>What it changes</th><th>Readiness</th></tr></thead>
    <tbody>
      <tr><td><strong>Public data connector</strong></td><td>Traceability, grading, disease reporting endpoints</td><td><span class="yes">Pattern in place</span></td></tr>
      <tr><td><strong>Breed & physiology</strong></td><td>Gestation length, estrus cycle, heat-stress thresholds, breed catalog</td><td><span class="yes">Per-farm parameters exist</span></td></tr>
      <tr><td><strong>Language & format</strong></td><td>Interface text, AI response language, date and currency</td><td><span class="part">i18n required — first work item</span></td></tr>
      <tr><td><strong>Regulation & workflow</strong></td><td>Disease reporting forms, prescription rules, withdrawal standards</td><td><span class="part">Korean reporting is the reference implementation</span></td></tr>
    </tbody>
  </table>`,
  foot:['Honesty','Right-to-left layout and full offline resilience are <strong>not done.</strong> We say so before the pilot, not during it.'],
  n:`<p>Never overstate readiness here. Officials will test this in the pilot and a failure there is unrecoverable.</p>
     <p class="say">"Full localization takes months, not weeks. We plan for that, and we will tell you which months."</p>
     <p>RTL (Arabic) is genuinely expensive. Offer <b>English UI</b> for early Gulf deployments — their working officials use it.</p>`});

add({t:['intl'], eyebrow:'Markets', stage:'So what',
  title:'Two priority regions, <em>two different entry models</em>',
  lede:'Southeast Asia enters through disease control and public financing. The Gulf enters through food security and direct national contracts.',
  body:`<div class="cols c2">
    <div class="card"><div class="kicker">Southeast Asia · VN · ID · TH</div><h4>Lead with disease containment</h4>
      <p>FMD and LSD are endemic; governments prioritize outbreak control over productivity.
      Smallholder structure means <strong>per-head pricing must be redesigned</strong> — cooperative and enterprise bundles, not per-animal fees.</p>
      <p><strong>Entry:</strong> KSP policy advisory → ODA-funded pilot → national budget scale-up.</p></div>
    <div class="card"><div class="kicker">Middle East · Central Asia · UAE · SA · UZ</div><h4>Lead with food security</h4>
      <p>Dairy self-sufficiency is a national security agenda, not an agricultural one. Budget constraints are lower and
      <strong>contracts are national in scale</strong>. Extreme heat stress and very large single farms drive the technical work.</p>
      <p><strong>Entry:</strong> direct national license with sovereign instance build.</p></div>
  </div>
  <table class="t">
    <thead><tr><th>Model</th><th>Structure</th><th>Best fit</th></tr></thead>
    <tbody>
      <tr><td><strong>A · National license</strong></td><td>Annual fixed fee + sovereign instance build</td><td>Gulf states</td></tr>
      <tr><td><strong>B · Per-head royalty</strong></td><td>Local partner operates, royalty per head</td><td>Southeast Asia, scale-up phase</td></tr>
      <tr><td><strong>C · ODA / KSP linked</strong></td><td>Public funds build it, then transition to operations</td><td>Southeast Asia, entry phase</td></tr>
      <tr><td><strong>D · White label</strong></td><td>Local brand, D2O core underneath</td><td>Where a large local incumbent exists</td></tr>
    </tbody>
  </table>`,
  n:`<p><b>Never quote Korean pricing abroad.</b> It is too expensive for Southeast Asia and too cheap for the Gulf — both lose the deal.</p>
     <p class="say">"I will not give you a number today, because the honest answer depends on your herd structure.
     Let us design the pilot first and price from real data."</p>
     <p>Financing is the real gate in Southeast Asia. <b>Design the funding route before the product pitch.</b></p>`});

add({t:['core','local','natl','vet','biz','impact','intl'], eyebrow:'한 장 요약', stage:'전체',
  title:'왜 → 무엇을 → 어떻게 → <em>그래서 무엇을 얻는가</em>',
  lede:'결재에 필요한 것은 이 한 장에 전부 있습니다.',
  body:`<div class="cols c4">
    <div class="card"><div class="kicker">왜</div><h4>셋 다 보이지 않아서<br>생기는 문제다</h4>
      <p><strong>지킬 사람이 없다</strong> — 농장동물 수의사 897명(11.2%)<br>
      <strong>질병은 늦게 발견된다</strong> — 살처분 보상금 5,289억<br>
      <strong>감축 수단이 없다</strong> — 축산 2030년 30% 감축 목표</p></div>
    <div class="card"><div class="kicker">무엇을</div><h4>알람과 행동 사이에<br>다리를 놓는다</h4>
      <p>소의 몸속 신호를 국가 공공데이터·AI와 결합해
      <strong>농가·수의사·방역관·행정이 각자의 언어로 "지금 무엇을 할지"</strong>를 받는 플랫폼.</p></div>
    <div class="card"><div class="kicker">어떻게</div><h4>한 화면에서<br>끝난다</h4>
      <p>감지 → 맥락 결합 → 추천 → 현장 실행 → 결과 피드백.<br>
      데이터 통합 · AI 해석 · 역할별 서빙 · 학습 루프 <strong>4층 전부 구현·가동 중</strong>.</p></div>
    <div class="card accent"><div class="kicker">그래서</div><h4>네 개의 성과를<br>금액으로</h4>
      <p><strong>① 농가</strong> 두당 연 8~24만원 · 자가도입 1.9년 회수<br>
      <strong>② 방역</strong> 럼피스킨 1회 = 271억<br>
      <strong>③ 환경</strong> 감축목표의 11~32%<br>
      <strong>④ 수의</strong> 1인 담당 15~20호 → 30~40호</p></div>
  </div>
  <div class="metrics">
    <div class="metric"><div class="fig">144억</div><div class="lab">연간 구독비용 (경기 10만두 · 월 12,000원)</div></div>
    <div class="metric amber"><div class="fig">1.24</div><div class="lab">BCR — <strong>보수 시나리오. 이 숫자로 말합니다</strong></div></div>
    <div class="metric"><div class="fig">3.04</div><div class="lab">BCR — 기준 시나리오 (문헌 중간값)</div></div>
    <div class="metric wide"><div class="fig">파일럿 5개 지표</div><div class="lab">감축두수·공태일·리드타임·조치기록률·두당마진</div></div>
  </div>`,
  foot:['요청','① <strong>시범사업</strong>(시군 + 공수의사 + 거점 대동물병원) ② <strong>데이터 연계 협조</strong>(KAHIS·이력제) ③ <strong>확산 로드맵 공동 수립</strong>'],
  n:`<p><b>한 장만 인쇄해서 들어가야 한다면 이 장이다.</b> 결재 라인에 그대로 넘길 수 있게 설계했다.</p>
     <p>네 칸을 손으로 짚으며 순서대로 읽는다. 각 칸에 30초. 2분이면 끝난다.</p>
     <p class="say">"평가 기준을 저희가 먼저 제안드리겠습니다. <b>이 다섯 지표가 움직이지 않으면 확산하지 마십시오.</b>"</p>
     <p><b>정직성 한 줄을 반드시 붙인다:</b> "개체 편익만 보면 보수 시나리오는 BCR 0.45로 미달합니다.
     이 사업의 정당성은 농가 수익이 아니라 <b>자원효율</b>에 있습니다."</p>`});

/* ── render ─────────────────────────────────────── */
const deck = document.getElementById('deck');
const tracksEl = document.getElementById('tracks');
const TNAME = Object.fromEntries(TRACKS.map(t=>[t.id,t.name]));

S.forEach((s,i)=>{
  const wrap = document.createElement('article');
  wrap.className = 'slide-wrap';
  wrap.dataset.tracks = s.t.join(' ');
  const no = String(i+1).padStart(2,'0');

  const head = s.cover ? '' : `
    <div class="s-top">
      <span class="eyebrow">${s.eyebrow||''}</span>
      ${s.stage?`<span class="stage-chip">${s.stage}</span>`:''}
    </div>
    <h2 class="s-title">${s.title||''}</h2>
    ${s.lede?`<p class="s-lede">${s.lede}</p>`:''}`;

  const foot = s.foot ? `<div class="s-foot"><span class="k">${s.foot[0]}</span><span>${s.foot[1]}</span></div>` : '';

  wrap.innerHTML = `
    <section class="slide${s.cover?' is-cover':''}">
      ${head}
      ${s.cover ? s.body : `<div class="s-body">${s.body||''}</div>`}
      ${foot}
      <span class="pageno">${no}</span>
    </section>
    <div class="tag-row">${s.t.map(t=>`<span class="tag">${TNAME[t]||t}</span>`).join('')}</div>
    ${s.n?`<details class="notes"><summary>발표자 노트 ${no}</summary><div class="nbody">${s.n}</div></details>`:''}`;
  deck.appendChild(wrap);
});

let active = 'all';
TRACKS.forEach(t=>{
  const count = t.id==='all' ? S.length : S.filter(s=>s.t.includes(t.id)).length;
  const b = document.createElement('button');
  b.className='track-btn'; b.type='button'; b.dataset.track=t.id;
  b.setAttribute('aria-pressed', String(t.id===active));
  b.innerHTML = `<span class="dot"></span><span>${t.name}</span><span class="tcount">${count}</span>`;
  b.addEventListener('click', ()=>setTrack(t.id));
  tracksEl.appendChild(b);
});

function setTrack(id){
  active = id;
  const t = TRACKS.find(x=>x.id===id);
  document.getElementById('trackName').textContent = t.name;
  document.getElementById('trackDesc').textContent = t.desc;
  tracksEl.querySelectorAll('.track-btn').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.track===id)));
  deck.querySelectorAll('.slide-wrap').forEach(w=>{
    w.hidden = !(id==='all' || w.dataset.tracks.split(' ').includes(id));
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

const nb = document.getElementById('notesBtn');
nb.addEventListener('click', ()=>{
  const anyClosed = [...deck.querySelectorAll('.notes')].some(d=>!d.open);
  deck.querySelectorAll('.notes').forEach(d=>{ d.open = anyClosed; });
  nb.textContent = anyClosed ? '노트 모두 접기' : '노트 모두 펼치기';
});
document.getElementById('printBtn').addEventListener('click', ()=>window.print());
